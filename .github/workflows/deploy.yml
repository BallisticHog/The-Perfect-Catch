name: Publish production images

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: production-images-${{ github.sha }}
    cancel-in-progress: false

jobs:
    verify:
        name: Verify selected commit
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            actions: read
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: catch_test
                    POSTGRES_PASSWORD: catch_test
                    POSTGRES_USER: catch_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U catch_test -d catch_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgres://catch_test:catch_test@localhost:5432/catch_test
            TEST_DATABASE_URL: postgres://catch_test:catch_test@localhost:5432/catch_test
            BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-validation
            GOOGLE_CLIENT_ID: ci-client-id
            GOOGLE_CLIENT_SECRET: ci-client-secret
            APP_BASE_URL: http://localhost:3000
            PUBLIC_CONTACT_EMAIL: catch@example.invalid
            MEDIA_ROOT: .data/media
            SNAPSHOT_ROOT: .data/snapshots
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Require successful CI for this exact commit
              uses: actions/github-script@v7
              with:
                  script: |
                      const response = await github.rest.actions.listWorkflowRuns(
                      {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          workflow_id: "ci.yml",
                          head_sha: context.sha,
                          status: "completed",
                          per_page: 100,
                      });
                      if (!response.data.workflow_runs.some(run => run.conclusion === "success"))
                      {
                          core.setFailed("This commit must pass CI before image publication.");
                      }
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.32.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @the-perfect-catch/db migrate
            - run: pnpm check
            - run: pnpm build
            - run: bash scripts/operations/test-contracts.sh

    publish:
        name: Publish SHA-tagged images
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: production-images
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                service: [web, worker]
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Compute lowercase image name
              id: image
              env:
                  REPOSITORY: ${{ github.repository }}
                  SERVICE: ${{ matrix.service }}
              run: printf 'name=ghcr.io/%s-%s\n' "${REPOSITORY,,}" "$SERVICE" >> "$GITHUB_OUTPUT"
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and publish
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: infra/${{ matrix.service }}.Dockerfile
                  push: true
                  platforms: linux/amd64
                  tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
            - name: Record published digest
              env:
                  IMAGE: ${{ steps.image.outputs.name }}
                  COMMIT_SHA: ${{ github.sha }}
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: printf 'Published `%s:%s` at `%s`. Deployment is a separate manual Tailscale operation.\n' "$IMAGE" "$COMMIT_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
