name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: catch_test
                    POSTGRES_PASSWORD: catch_test
                    POSTGRES_USER: catch_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U catch_test -d catch_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgres://catch_test:catch_test@localhost:5432/catch_test
            TEST_DATABASE_URL: postgres://catch_test:catch_test@localhost:5432/catch_test
            BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-validation
            GOOGLE_CLIENT_ID: ci-client-id
            GOOGLE_CLIENT_SECRET: ci-client-secret
            APP_BASE_URL: http://localhost:3000
            PUBLIC_CONTACT_EMAIL: catch@example.invalid
            MEDIA_ROOT: .data/media
            SNAPSHOT_ROOT: .data/snapshots
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.32.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @the-perfect-catch/db migrate
            - run: pnpm check
            - run: pnpm --filter @the-perfect-catch/web exec playwright install --with-deps chromium
            - run: pnpm test:e2e
            - run: pnpm build
            - name: Upload browser failure evidence
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: browser-failure-evidence
                  path: test-results/
                  if-no-files-found: ignore

    dependency-audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.32.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --audit-level high

    operations-contracts:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: bash scripts/operations/test-contracts.sh

    container-build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            matrix:
                service: [web, worker]
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - name: Build production image without publishing
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: infra/${{ matrix.service }}.Dockerfile
                  push: false
                  platforms: linux/amd64
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}

    secret-scan:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@v2
