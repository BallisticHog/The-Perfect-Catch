name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: catch_test
                    POSTGRES_PASSWORD: catch_test
                    POSTGRES_USER: catch_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U catch_test -d catch_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgres://catch_test:catch_test@localhost:5432/catch_test
            BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-validation
            GOOGLE_CLIENT_ID: ci-client-id
            GOOGLE_CLIENT_SECRET: ci-client-secret
            APP_BASE_URL: http://localhost:3000
            PUBLIC_CONTACT_EMAIL: catch@example.invalid
            MEDIA_ROOT: .data/media
            SNAPSHOT_ROOT: .data/snapshots
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.32.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm build

    dependency-audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.32.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --audit-level high

    secret-scan:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@v2
